# Cloudflare Pages + Functions + D1. Git integration builds branch main.
# Keep this binding aligned with the existing production project.
# EXPORT_KEY, GEETEST_KEY and VITE_GEETEST_CAPTCHA_ID are configured in
# Cloudflare Pages environment settings, never committed as credentials.
name = "research-bti"
compatibility_date = "2025-05-05"
pages_build_output_dir = "dist"

# This ID matches the existing production DB. Forks must use their own DB.
# Local Pages development simulates D1 unless remote access is explicitly used.
[[d1_databases]]
binding = "DB"
database_name = "bti-responses"
database_id = "bff130d1-ec7f-4b4f-a332-641e6577cc66"
