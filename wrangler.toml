# Cloudflare Pages + Functions + D1 配置。
# 主要用于本地开发（wrangler pages dev）与直接 wrangler 部署。
# 注意：本项目走 GitHub 集成自动构建，线上的 D1 绑定需在
# Cloudflare 后台「Pages 项目 → Settings → Functions → Bindings」另行配置，
# 导出口令 EXPORT_KEY 在「Settings → Environment variables」配置。
name = "research-bti"
compatibility_date = "2025-05-05"
pages_build_output_dir = "dist"

# D1 绑定：代码里通过 env.DB 访问。
# 线上走 GitHub 集成 + 后台绑定，本 database_id 不参与生产；它只用于本地 dev /
# 直接 wrangler 部署。部署前可换成 `wrangler d1 create bti-responses` 返回的真实 id。
[[d1_databases]]
binding = "DB"
database_name = "bti-responses"
database_id = "0b6c93c4-d8c0-45ea-85ba-c78081bd708b"
